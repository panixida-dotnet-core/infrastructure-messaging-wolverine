name: CI

on:
    push:
        branches: [ main ]
    pull_request:

permissions:
    contents: read
    packages: write

jobs:
    native-aot:
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v7
            with:
              fetch-depth: 0
          - uses: actions/setup-dotnet@v6
            with:
              global-json-file: global.json
          - name: Publish and run Native AOT Kafka documentation source
            run: |
              dotnet publish tests/PANiXiDA.Core.Infrastructure.Messaging.Wolverine.AotSmoke -c Release -r linux-x64 -o /tmp/kafka-docs-aot
              /tmp/kafka-docs-aot/PANiXiDA.Core.Infrastructure.Messaging.Wolverine.AotSmoke
    format:
        uses: PANiXiDA-Infrastructure/ci-cd/.github/workflows/dotnet-format.yml@main
        secrets:
          registry-user: ${{ secrets.REGISTRY_USER }}
          registry-token: ${{ secrets.REGISTRY_TOKEN }}
        
    tests:
        uses: PANiXiDA-Infrastructure/ci-cd/.github/workflows/dotnet-tests.yml@main
        secrets:
          registry-user: ${{ secrets.REGISTRY_USER }}
          registry-token: ${{ secrets.REGISTRY_TOKEN }}

    sonar:
        needs: tests
        uses: PANiXiDA-Infrastructure/ci-cd/.github/workflows/dotnet-sonar.yml@main
        with:
          project-key: ${{ vars.SONAR_PROJECT_KEY }}
        secrets:
          sonar-token: ${{ secrets.SONAR_TOKEN }}
          registry-user: ${{ secrets.REGISTRY_USER }}
          registry-token: ${{ secrets.REGISTRY_TOKEN }}

    publish:
      if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      needs: 
        - format
        - tests
        - sonar
        - native-aot
      uses: PANiXiDA-Infrastructure/ci-cd/.github/workflows/dotnet-publish-global-nuget.yml@main
      secrets:
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

    notify:
      if: ${{ always() && github.event_name != 'pull_request' }}
      needs: [ publish ]
      uses: PANiXiDA-Infrastructure/ci-cd/.github/workflows/notify-telegram.yml@main
      with:
        event-name: ${{ github.event_name }}    
      secrets:
        telegram-bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        telegram-chat-id: ${{ vars.TELEGRAM_CHAT_ID }}
        github-token: ${{ secrets.REGISTRY_TOKEN }}
